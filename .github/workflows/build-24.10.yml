name: Build-K2P-24.10
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: 释放空间 + 更换清华源
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo sed -i 's/archive.ubuntu.com/mirrors.tuna.tsinghua.edu.cn/g' /etc/apt/sources.list
          sudo sed -i 's/security.ubuntu.com/mirrors.tuna.tsinghua.edu.cn/g' /etc/apt/sources.list

      - name: 配置8G Swap
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential flex bison gawk python3 python3-pip git wget curl unzip libssl-dev libncurses-dev zlib1g-dev

      - name: 拉取 ImmortalWrt 24.10 源码
        run: |
          git clone https://github.com/immortalwrt/immortalwrt.git --branch openwrt-24.10 --depth 1 openwrt
          cd openwrt

      - name: Feeds 更新安装
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 写入配置 + 锁定 K2P
        run: |
          cd openwrt
          cat > .config <<'EOF'
CONFIG_TARGET_ramips=y
CONFIG_TARGET_ramips_mt7621=y
CONFIG_TARGET_ramips_mt7621_DEVICE_phicomm_k2p=y
CONFIG_PACKAGE_base-files=y
CONFIG_PACKAGE_busybox=y
CONFIG_PACKAGE_libc=y
CONFIG_PACKAGE_libgcc=y
CONFIG_PACKAGE_libubox=y
CONFIG_PACKAGE_logd=y
CONFIG_PACKAGE_mtd=y
CONFIG_PACKAGE_netifd=y
CONFIG_PACKAGE_odhcp6c=y
CONFIG_PACKAGE_odhcpd-ipv6only=y
CONFIG_PACKAGE_opkg=y
CONFIG_PACKAGE_procd=y
CONFIG_PACKAGE_uci=y
CONFIG_PACKAGE_wireless-regdb=y
CONFIG_PACKAGE_luci=y
CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
CONFIG_PACKAGE_luci-compat=y
CONFIG_PACKAGE_luci-lib-ipkg=y
CONFIG_PACKAGE_luci-lib-jsonc=y
CONFIG_PACKAGE_luci-lib-nixio=y
CONFIG_PACKAGE_luci-mod-admin-full=y
CONFIG_PACKAGE_luci-theme-bootstrap=y
CONFIG_PACKAGE_default-settings=n
CONFIG_PACKAGE_default-settings-chn=n
CONFIG_PACKAGE_kmod-ath9k=y
CONFIG_PACKAGE_kmod-ath10k=y
CONFIG_PACKAGE_ath10k-firmware-qca988x=y
CONFIG_PACKAGE_kmod-nft-offload=y
CONFIG_PACKAGE_kmod-nft-fullcone=y
CONFIG_PACKAGE_kmod-tcp-bbr=y
CONFIG_PACKAGE_luci-app-upnp=y
CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y
CONFIG_PACKAGE_miniupnpd-nftables=y
CONFIG_PACKAGE_kmod-tun=y
CONFIG_PACKAGE_zerotier=y
CONFIG_PACKAGE_luci-app-zerotier=y
CONFIG_PACKAGE_luci-i18n-zerotier-zh-cn=y
CONFIG_PACKAGE_curl=y
CONFIG_PACKAGE_wget=y
EOF
          ./scripts/config --set-val TARGET_ramips_mt7621_DEVICE_adslr_g7 n
          ./scripts/config --set-val TARGET_ramips_mt7621_DEVICE_hiwifi_hc5962 n
          ./scripts/config --set-val TARGET_ramips_mt7621_DEVICE_youku_l2 n
          make defconfig
          echo "=== 当前选中 mt7621 设备 ==="
          grep "CONFIG_TARGET_ramips_mt7621_DEVICE.*=y" .config
          if ! grep -q "CONFIG_TARGET_ramips_mt7621_DEVICE_phicomm_k2p=y" .config; then
            echo "❌ 未选中 phicomm_k2p，终止编译"
            exit 1
          fi

      - name: 双线程编译，输出日志
        run: |
          cd openwrt
          set -o pipefail
          make -j2 V=s 2>&1 | tee build.log
        continue-on-error: true

      - name: 上传编译日志
        uses: actions/upload-artifact@main
        with:
          name: build-log-24.10
          path: openwrt/build.log

      - name: 上传固件
        uses: actions/upload-artifact@main
        with:
          name: K2P-24.10-FW
          path: openwrt/bin/targets/ramips/mt7621/
