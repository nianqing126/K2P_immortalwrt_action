name: Build K2P ImmortalWrt 24.10
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@main

      - name: 替换Ubuntu源为清华镜像
        run: |
          sudo sed -i 's/archive.ubuntu.com/mirrors.tuna.tsinghua.edu.cn/g' /etc/apt/sources.list
          sudo sed -i 's/security.ubuntu.com/mirrors.tuna.tsinghua.edu.cn/g' /etc/apt/sources.list

      - name: 配置8G Swap
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=8192 status=progress
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential flex bison gawk python3 python3-pip git wget curl unzip libssl-dev libncurses-dev zlib1g-dev

      - name: 拉取 ImmortalWrt 24.10 源码
        run: |
          git clone https://github.com/immortalwrt/immortalwrt.git --branch openwrt-24.10 --depth 1 openwrt
          cd openwrt

      - name: 导入配置
        run: |
          cp configs/immortalwrt-24.10.config openwrt/.config
          cd openwrt
          make defconfig
          # 关闭全量host编译，防止疯狂吃内存
          sed -i 's/CONFIG_BUILD_ALL_HOST=y/CONFIG_BUILD_ALL_HOST=n/g' .config

      - name: 更新feeds并安装
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 编译固件（单线程 -j1）
        run: |
          cd openwrt
          make -j1 V=s

      - name: 上传固件成品
        uses: actions/upload-artifact@main
        with:
          name: K2P-ImmortalWrt-24.10
          path: openwrt/bin/targets/ramips/mt7621/
