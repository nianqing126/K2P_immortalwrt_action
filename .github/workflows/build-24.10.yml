name: Build K2P ImmortalWrt 24.10

on:
  workflow_dispatch:

jobs:
  build:
    name: 24.10
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4

      - name: 清理 runner 预装大包，释放内存与磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          free -h
          df -h

      - name: 替换 Ubuntu 源为清华镜像（规避 azure 源连接超时）
        run: |
          sudo sed -i.bak 's/azure.archive.ubuntu.com/mirrors.tuna.tsinghua.edu.cn/g' /etc/apt/sources.list 2>/dev/null || true
          sudo sed -i.bak 's/security.ubuntu.com/mirrors.tuna.tsinghua.edu.cn/g' /etc/apt/sources.list 2>/dev/null || true

      - name: 配置 6G Swap（先关旧 swap 再建，避免 Text file busy）
        run: |
          sudo swapoff -a || true
          sleep 2
          sudo rm -f /swapfile
          sleep 1
          sudo fallocate -l 6G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=6144 status=progress
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: 安装编译依赖
        run: |
          sudo apt-get update --fix-missing
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib gettext \
            git libncurses-dev libssl-dev libxml-parser-perl make patch \
            python3 python3-setuptools rsync unzip wget zlib1g-dev file \
            libyaml-dev swig libelf-dev
          sudo apt-get clean

      - name: 拉取 ImmortalWrt openwrt-24.10 源码
        run: |
          git clone --depth 1 --branch openwrt-24.10 \
            https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: 重置 feeds 配置并更新安装
        working-directory: openwrt
        run: |
          git checkout feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 写入种子配置与 overlay 文件
        run: |
          cp configs/immortalwrt-24.10.config openwrt/.config
          mkdir -p openwrt/files
          cp -a files/. openwrt/files/

      - name: 生成 defconfig 并校验 K2P 设备（仅一次 defconfig）
        working-directory: openwrt
        run: |
          make defconfig
          echo "=== 当前选中的 mt7621 设备 ==="
          grep -E '^CONFIG_TARGET_DEVICE_ramips_mt7621_DEVICE_.*=y' .config
          grep -q '^CONFIG_TARGET_DEVICE_ramips_mt7621_DEVICE_phicomm_k2p=y' .config \
            || { echo '!! 未选中 phicomm_k2p，设备配置未生效，中止编译'; exit 1; }

      - name: 下载软件包源码
        working-directory: openwrt
        run: make download -j2 V=s

      - name: 双线程编译，保存完整日志（失败也上传日志）
        working-directory: openwrt
        continue-on-error: true
        run: |
          set -o pipefail
          make -j2 V=s 2>&1 | tee build.log

      - name: 上传编译日志
        uses: actions/upload-artifact@v4
        with:
          name: build-log-24.10
          path: openwrt/build.log
          retention-days: 30

      - name: 查看镜像体积
        run: |
          ls -lh openwrt/bin/targets/ramips/mt7621/
          find openwrt/bin/targets/ramips/mt7621/ -name "*.bin" -exec ls -lh {} \;

      - name: 体积校验（16MB 闪存，镜像必须 < 15MB）
        run: |
          MAX=$((15 * 1024 * 1024))
          BIG=$(find openwrt/bin/targets/ramips/mt7621/ -name "*-sysupgrade*.bin" -size +${MAX}c | head -1)
          if [ -n "$BIG" ]; then
            echo "!! 镜像超过 15MB，16MB 闪存装不下: $BIG"
            exit 1
          fi

      - name: 上传编译产物（通配全部 bin，避免机型名匹配不到）
        uses: actions/upload-artifact@v4
        with:
          name: k2p-24.10
          path: |
            openwrt/bin/targets/ramips/mt7621/*.bin
            openwrt/bin/targets/ramips/mt7621/*.sha256
          retention-days: 30
