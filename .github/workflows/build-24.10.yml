name: Build K2P ImmortalWrt 24.10
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4

      - name: 替换Ubuntu源为清华镜像
        run: |
          sudo sed -i 's/archive.ubuntu.com/mirrors.tuna.tsinghua.edu.cn/g' /etc/apt/sources.list
          sudo sed -i 's/security.ubuntu.com/mirrors.tuna.tsinghua.edu.cn/g' /etc/apt/sources.list

      - name: 增加4G Swap
        uses: pierreroches/swapfile-action@v1
        with:
          size: 4G

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential flex bison gawk python3 python3-pip python3-setuptools python3-dev git wget curl unzip libssl-dev libncurses5-dev zlib1g-dev

      - name: 拉取 ImmortalWrt 24.10 源码
        run: |
          git clone https://github.com/immortalwrt/immortalwrt.git --branch openwrt-24.10 --depth 1 openwrt
          cd openwrt
          git pull

      - name: 导入配置
        run: |
          cp configs/immortalwrt-24.10.config openwrt/.config
          cd openwrt
          make defconfig

      - name: 更新 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 编译固件
        run: |
          cd openwrt
          make -j$(nproc) V=s

      - name: 查看镜像体积
        run: ls -lh openwrt/bin/targets/ramips/mt7621/

      - name: 体积校验（小于15MB）
        run: |
          MAX=$((15 * 1024 * 1024))
          cd openwrt/bin/targets/ramips/mt7621/
          for f in *.bin; do
            SIZE=$(stat -c %s "$f")
            if [ $SIZE -gt $MAX ]; then
              echo "❌ $f 超过15M限制"
              exit 1
            fi
          done

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: K2P-24.10-firmware
          path: openwrt/bin/targets/ramips/mt7621/*.bin
