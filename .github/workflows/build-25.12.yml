name: Build K2P ImmortalWrt 25.12.2
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 仓库
        uses: actions/checkout@main

      - name: 替换Ubuntu源为清华镜像
        run: |
          sudo sed -i 's/archive.ubuntu.com/mirrors.tuna.tsinghua.edu.cn/g' /etc/apt/sources.list
          sudo sed -i 's/security.ubuntu.com/mirrors.tuna.tsinghua.edu.cn/g' /etc/apt/sources.list

      - name: 增加6G Swap（25.12内核大、更吃内存）
        run: |
          sudo swapoff -a
          sleep 2
          sudo rm -f /swapfile
          sleep 1
          sudo dd if=/dev/zero of=/swapfile bs=1M count=6144 status=progress
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential flex bison gawk python3 python3-pip git wget curl unzip libssl-dev libncurses-dev zlib1g-dev

      - name: 拉取 ImmortalWrt v25.12.2 源码
        run: |
          git clone https://github.com/immortalwrt/immortalwrt.git --branch openwrt-25.12 --depth 1 openwrt
          cd openwrt

      - name: 导入配置
        run: |
          cp configs/immortalwrt-25.12.config openwrt/.config
          cd openwrt
          make defconfig
          sed -i 's/CONFIG_BUILD_ALL_HOST=y/CONFIG_BUILD_ALL_HOST=n/g' .config

      - name: 更新并安装 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 单线程编译，输出完整日志
        run: |
          cd openwrt
          make -j1 V=s

      - name: 上传固件成品
        uses: actions/upload-artifact@main
        with:
          name: K2P-ImmortalWrt-25.12.2
          path: openwrt/bin/targets/ramips/mt7621/
