name: 编译 K2P A2 固件 - LEDE 方案

# 触发方式：仅手动 —— 在 Actions 页面点击 Run workflow
# （增删/修改文件不会再触发编译，避免无谓重编译）
on:
  workflow_dispatch:
    inputs:
      debug:
        description: '编译失败后是否开启 tmate 远程调试 (30分钟)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      release:
        description: '编译成功后是否发布为 Release'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# ======================== 可自定义环境变量 ========================
env:
  # OpenWrt 源码仓库（默认 Lean 的 LEDE，自带中文 LuCI 与 MTK 驱动）
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  # 编译配置文件
  CONFIG_FILE: configs/k2p-a2-lean.config
  # DIY 脚本：用于加载第三方源、打补丁等（可留空）
  DIY_SCRIPT: scripts/diy-lean.sh
  # 固件输出目录（K2P = ramips/mt7621）
  FIRMWARE_DIR: bin/targets/ramips/mt7621
  # 设备标识
  DEVICE_NAME: phicomm_k2p
  # 16MB 闪存固件上限（单位 KiB），来自源码 IMAGE_SIZE := 15744k
  MAX_FIRMWARE_KB: 15744
  TZ: Asia/Shanghai

jobs:
  build:
    name: 云编译 K2P A2
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: 检出编译项目
        uses: actions/checkout@v4

      - name: 初始化编译环境
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3 python3-distutils rsync unzip zlib1g-dev file wget \
            libelf-dev ccache
          echo "编译依赖安装完成"

      - name: 获取 OpenWrt 源码
        run: |
          git clone --depth=1 -b "$REPO_BRANCH" "$REPO_URL" openwrt
          cd openwrt
          echo "源码提交: $(git log -1 --format='%h %cs %s')"

      - name: 更新 Feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 执行 DIY 脚本 (第三方源/补丁)
        working-directory: openwrt
        run: |
          if [ -f "../$DIY_SCRIPT" ] && [ -s "../$DIY_SCRIPT" ]; then
            bash "../$DIY_SCRIPT"
          else
            echo "DIY 脚本为空，跳过"
          fi

      - name: 加载编译配置
        working-directory: openwrt
        run: |
          cp "../$CONFIG_FILE" .config
          # 复制自定义文件（首次启动脚本、默认配置等）
          if [ -d ../files-lean ]; then
            rm -rf files
            cp -a ../files-lean ./files
          fi
          make defconfig

          # ★ 双保险：Lean master 默认勾选 ssr-plus/xray/双主题/IPv6 全家桶，
          #   即便 seed 配置里写了 =n，这里再从 .config 强制剔除，确保不超限。
          DISABLE="
            luci-app-ssr-plus xray-core dns2tcp ipt2socks microsocks v2ray shadowsocksr-libev
            luci-app-vlmcsd vlmcsd luci-app-vsftpd vsftpd luci-app-filetransfer
            luci-app-ddns ddns-scripts luci-app-nlbwmon nlbwmon luci-app-wol
            luci-app-arpbind luci-app-autoreboot luci-theme-design
          "
          for p in $DISABLE; do
            sed -i "s/^CONFIG_PACKAGE_${p}=y$/# CONFIG_PACKAGE_${p} is not set/" .config
          done

          echo "===== 关键保留项(含 IPv6) ====="
          grep -E 'CONFIG_TARGET_ramips_mt7621_DEVICE_phicomm_k2p|CONFIG_PACKAGE_(zerotier|luci-app-zerotier|luci-app-upnp|kmod-nft-offload|kmod-nft-fullcone|kmod-tcp-bbr|luci-proto-ipv6|odhcpd-ipv6only|odhcp6c|ipv6helper|ip6tables|kmod-ip6tables)' .config || true
          echo "===== 确认全家桶已关闭(应无 y 输出) ====="
          grep -E '^CONFIG_PACKAGE_(luci-app-ssr-plus|xray-core|luci-app-vlmcsd|luci-app-vsftpd|luci-theme-design)=y$' .config || echo "OK: 全家桶已全部关闭"
          echo "===== 关键依赖 oui 必须开启 ====="
          grep -E '^CONFIG_PACKAGE_luci-app-oui=y$' .config && echo "OK: oui 已开启" || echo "::error::luci-app-oui 被关闭会导致 luci 安装失败，请在配置中设为 =y"

      - name: 预下载 dl 依赖
        working-directory: openwrt
        run: make -j$(nproc) download V=s

      - name: 编译固件
        working-directory: openwrt
        run: |
          make -j$(($(nproc) + 1)) V=s
          echo "编译命令返回码: $?"

      - name: 诊断镜像产物 (无论成败都列出)
        working-directory: openwrt
        if: always()
        run: |
          echo "===== 目标设备 (.config 校验) ====="
          grep -E 'CONFIG_TARGET_ramips_mt7621_DEVICE_phicomm_k2p|CONFIG_PACKAGE_luci-app-turboacc' .config 2>/dev/null || echo "未读到 .config"
          echo ""
          echo "===== bin/targets/ramips/mt7621 目录内容 ====="
          ls -lh bin/targets/ramips/mt7621/ 2>/dev/null || echo "目录不存在：编译未产出该目标镜像"
          echo ""
          echo "===== 搜索所有 sysupgrade/factory 固件 ====="
          find bin/targets -type f \( -name '*sysupgrade*.bin' -o -name '*factory*.bin' \) -printf '%p  %k KiB\n' 2>/dev/null || true
          echo ""
          echo "===== 扫描编译日志中的体积超限关键字 ====="
          if grep -riq 'too big\|exceed\|Image.*too large' logs/ 2>/dev/null; then
            echo "::warning::检测到镜像体积超限相关日志，固件可能被跳过。请精简插件。"
            grep -ri 'too big\|exceed\|Image.*too large' logs/ 2>/dev/null | tail -20 || true
          else
            echo "未在 logs/ 中发现体积超限关键字"
          fi

      - name: 校验固件大小 (16MB 限制)
        working-directory: openwrt
        run: |
          set -e
          # 放宽匹配：兼容 squashfs-sysupgrade / sysupgrade / K2P 各种命名
          FW=$(find "$FIRMWARE_DIR" -maxdepth 1 -type f -name '*sysupgrade*.bin' 2>/dev/null | head -n1)
          if [ -z "$FW" ]; then
            echo "::error::未找到 sysupgrade 固件（$FIRMWARE_DIR 下无匹配文件）。"
            echo "::error::常见原因：① 固件体积超过 15744k 被跳过；② 目标设备未选中；③ 编译中途失败。"
            echo "::error::请查看上一步『诊断镜像产物』列出的目录内容与编译日志中的 'Image files are too big' 字样。"
            exit 1
          fi
          SIZE_KB=$(( $(stat -c %s "$FW") / 1024 ))
          echo "固件: $FW"
          echo "固件大小: ${SIZE_KB} KiB / 上限 ${MAX_FIRMWARE_KB} KiB"
          if [ "$SIZE_KB" -gt "$MAX_FIRMWARE_KB" ]; then
            echo "::error::固件超过 16MB 闪存上限 (${SIZE_KB} > ${MAX_FIRMWARE_KB} KiB)，请精简插件后重编译！"
            exit 1
          fi
          echo "✅ 固件大小符合 16MB 闪存要求"

      - name: 整理固件产物
        run: |
          mkdir -p artifact
          find openwrt/$FIRMWARE_DIR -maxdepth 1 -type f \( -name '*sysupgrade*.bin' -o -name '*factory*.bin' \) \
            -exec cp {} artifact/ \; 2>/dev/null || true
          cd artifact
          [ -n "$(ls *.bin 2>/dev/null)" ] && sha256sum *.bin > sha256sum.txt || echo "无固件文件可校验"
          echo "===== 产物清单 ====="
          ls -lh

      - name: 上传固件 (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: k2p-a2-firmware-${{ github.run_number }}
          path: artifact/*
          retention-days: 90
          if-no-files-found: error

      - name: 发布 Release
        if: inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: k2p-a2-${{ github.run_number }}
          name: K2P A2 固件 - ${{ github.run_number }}
          body: |
            自动编译的斐讯 K2P A2 固件（16MB 原厂闪存）
            功能：ZeroTier + 中文页 / UPnP + 中文页 / 硬件加速 / BBR / Fullcone NAT
            源码：${{ env.REPO_URL }} (${{ env.REPO_BRANCH }})
          files: artifact/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 远程调试 (失败时)
        if: failure() && inputs.debug == 'true'
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
          timeout-minutes: 30
