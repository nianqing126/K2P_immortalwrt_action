name: Build K2P ImmortalWrt 25.12.2 ZeroTier Firmware

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 发布标签（留空则只存 Artifacts，不发 Release）
        default: ""

jobs:
  build:
    name: 25.12.2
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4

      - name: 替换 Ubuntu 源为清华镜像（规避 azure 源连接超时）
        run: |
          sudo sed -i 's/azure.archive.ubuntu.com/mirrors.tuna.tsinghua.edu.cn/g' /etc/apt/sources.list 2>/dev/null || true
          sudo sed -i 's/security.ubuntu.com/mirrors.tuna.tsinghua.edu.cn/g' /etc/apt/sources.list 2>/dev/null || true
          # 24.04+ 源文件在 sources.list.d/ubuntu.sources
          sudo sed -i 's/azure.archive.ubuntu.com/mirrors.tuna.tsinghua.edu.cn/g' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
          sudo sed -i 's/security.ubuntu.com/mirrors.tuna.tsinghua.edu.cn/g' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true

      - name: 安装编译依赖
        run: |
          sudo apt-get update --fix-missing
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib gettext \
            git libncurses-dev libssl-dev libxml-parser-perl make patch \
            python3 python3-setuptools rsync unzip wget zlib1g-dev file \
            libyaml-dev swig libelf-dev
          sudo apt-get clean

      - name: 拉取 ImmortalWrt v25.12.2 源码（固定发行标签）
        run: |
          git clone --depth 1 --branch v25.12.2 \
            https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: 更新并安装 feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 写入种子配置
        run: cp configs/immortalwrt-25.12.config openwrt/.config

      - name: 生成 defconfig（自动补齐 ZeroTier / UPnP / kmod 依赖）
        working-directory: openwrt
        run: make defconfig

      - name: 下载软件包源码
        working-directory: openwrt
        run: make download -j2 V=s

      - name: 编译固件
        working-directory: openwrt
        run: make -j2 V=s

      - name: 查看镜像体积
        run: |
          ls -lh openwrt/bin/targets/ramips/mt7621/
          find openwrt/bin/targets/ramips/mt7621/ -name "*sysupgrade*.bin" -exec ls -lh {} \;

      - name: 体积校验（16MB 闪存，镜像必须 < 15MB）
        run: |
          MAX=$((15 * 1024 * 1024))
          BIG=$(find openwrt/bin/targets/ramips/mt7621/ -name "*sysupgrade*.bin" -size +${MAX}c | head -1)
          if [ -n "$BIG" ]; then
            echo "!! 镜像超过 15MB，16MB 闪存装不下: $BIG"
            exit 1
          fi

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: k2p-25.12.2
          path: |
            openwrt/bin/targets/ramips/mt7621/*k2p*.bin
            openwrt/bin/targets/ramips/mt7621/*k2p*.sha256
          retention-days: 30
